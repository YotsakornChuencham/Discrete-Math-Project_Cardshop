  <script src="app.js"></script>


  <script>

    /* =====================================================
       CHECKOUT CALCULATION
       ===================================================== */

    function processCalculation() {

      const cart =
        getCartFromStorage();


      const cartTotal =
        cart.reduce(
          (sum, item) =>
            sum +
            (item.price * item.qty),
          0
        );


      const memberCheckbox =
        document.getElementById(
          'isMember'
        );


      const couponInput =
        document.getElementById(
          'couponCode'
        );


      const isMember =
        memberCheckbox
          ? memberCheckbox.checked
          : false;


      const couponCode =
        couponInput
          ? couponInput.value
          : '';


      const result =
        calculateDiscount(
          cartTotal,
          isMember,
          couponCode
        );


      document
        .getElementById(
          'basePriceDisplay'
        )
        .innerText =
          cartTotal.toLocaleString(
            'th-TH',
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          ) + ' ฿';


      document
        .getElementById(
          'discountRateDisplay'
        )
        .innerText =
          result.discountPercent +
          '%';


      document
        .getElementById(
          'reasonDisplay'
        )
        .innerText =
          result.reason;


      document
        .getElementById(
          'netTotalDisplay'
        )
        .innerText =
          result.netTotal.toLocaleString(
            'th-TH',
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          ) + ' ฿';

    }


    /* Initial Calculation */

    document.addEventListener(
      'DOMContentLoaded',
      processCalculation
    );

  </script>
