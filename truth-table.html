    content="LogicCraft Games Boolean Logic Filter"

    <div class="logo">

      >
        ตรวจสอบสถานะสินค้าและโปรโมชั่น
      </a>

      <a href="checkout.html">
        คำนวณราคา
      </a>


      <button
        type="button"
        class="cart-icon-btn"
        onclick="toggleCart()"
        aria-label="เปิดตะกร้า"
      >

        🛒

        <span
          class="cart-badge hidden"
          id="cartBadge"
        >
          0
        </span>

      </button>

    </nav>

  </header>



  <!-- MAIN -->

  <main class="container">

    <h1 class="page-title">
      ตรวจสอบสถานะสินค้าและโปรโมชั่น
    </h1>

    <!-- BOOLEAN CONTROLS -->

    <section
      class="search-filter-bar"
      style="
        flex-direction: column;
        align-items: stretch;
      "
    >

      <label class="checkbox-group">

        <input
          type="checkbox"
          id="p_val"
          checked
        >

        <span>
          <strong>P:</strong>
          สินค้าพร้อมส่ง (InStock)
        </span>

      </label>


      <label class="checkbox-group">

        <input
          type="checkbox"
          id="q_val"
          checked
        >

        <span>
          <strong>
            OnSale
          </strong>
        </span>

      </label>


      <label class="checkbox-group">

        <input
          type="checkbox"
          id="r_val"
        >

        <span>
          <strong>
          ราคาน้อยกว่า 500 บาท
          </strong>
        </span>
      </label>


      <div
        style="
          margin-top: 0.5rem;
          padding-top: 0.8rem;
          border-top: 1px solid var(--border-color);
        "
      >

        <span
          id="truthValueResult"
          style="font-weight: bold;"
        >
          -
        </span>

      </div>

    </section>



    <!-- RESULT -->

    <section
      id="booleanResults"
      class="grid"
      aria-live="polite"
    >
    </section>

  </main>



  <!-- CART OVERLAY -->

  <div
    class="overlay"
    id="cartOverlay"
    onclick="toggleCart()"
  ></div>


  <!-- CART -->

  <aside
    class="cart-drawer"
    id="cartDrawer"
    aria-hidden="true"
  >

    <div class="cart-header">

      <h2>
        🛒 ตะกร้าสินค้า
      </h2>

      <button
        type="button"
        onclick="toggleCart()"
      >
        ✕
      </button>

    </div>


    <div
      class="cart-body"
      id="cartItems"
    >
    </div>


    <div class="cart-footer">

      <div class="cart-total-row">

        <span>
          ยอดรวม
        </span>

        <strong id="cartTotalPrice">
          0.00 ฿
        </strong>

      </div>


      <a
        href="checkout.html"
        class="btn checkout-btn"
      >
        ไปหน้าคำนวณราคา
      </a>

    </div>

  </aside>



  <!-- FOOTER -->

  <footer>
